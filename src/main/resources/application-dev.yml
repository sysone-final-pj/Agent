# 개발 환경 설정
spring:
  config:
    activate:
      on-profile: dev

# Docker 설정 (로컬 개발환경)
docker:
  host: ${DOCKER_HOST:tcp://localhost:2375}
  tls-verify: ${DOCKER_TLS_VERIFY:false}
  cert-path: ${DOCKER_CERT_PATH:}

# JWT 설정
jwt:
  secret: ${JWT_SECRET:my-super-secret-key-for-agent-authentication-1234567890}

# Backend 서버 설정
backend:
  host: ${BE_HOST:http://localhost:8081}
  api:
    metrics: /api/agent/metrics

# 스케줄링 설정
scheduler:
  metrics-push:
    fixed-delay: 5000      # 5초마다 실행 (밀리초)
    initial-delay: 10000   # 애플리케이션 시작 후 10초 뒤 첫 실행
  thread-pool:
    core-size: 2           # 기본 스레드 수
    max-size: 5            # 최대 스레드 수
    queue-capacity: 10     # 큐 용량

# 서버 포트
server:
  port: 8080

# 로그 레벨 (개발환경에서는 DEBUG 사용)
logging:
  level:
    root: INFO
    com.agent.monito: DEBUG
    com.agent.monito.global.jwt.JwtTokenProvider: DEBUG