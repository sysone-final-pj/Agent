# 운영 환경 설정
spring:
  config:
    activate:
      on-profile: prod

# Docker 설정 (운영환경)
docker:
  host: ${DOCKER_HOST:unix:///var/run/docker.sock}
  tls-verify: ${DOCKER_TLS_VERIFY:true}
  cert-path: ${DOCKER_CERT_PATH:/etc/docker/certs}

# JWT 설정
jwt:
  secret: ${JWT_SECRET}

# 서버 포트
server:
  port: ${SERVER_PORT:8080}

# 스케줄링 설정 (운영환경)
scheduler:
  metrics-push:
    fixed-delay: 10000     # 10초마다 실행 (밀리초)
    initial-delay: 15000   # 애플리케이션 시작 후 15초 뒤 첫 실행
  logs-push:
    fixed-delay: 30000     # 30초마다 실행 (밀리초)
    initial-delay: 20000   # 애플리케이션 시작 후 20초 뒤 첫 실행
  thread-pool:
    core-size: 3           # 기본 스레드 수
    max-size: 10           # 최대 스레드 수
    queue-capacity: 20     # 큐 용량

# 로그 레벨 (운영환경에서는 INFO/WARN 레벨 사용)
logging:
  level:
    root: INFO
    com.agent.monito: INFO
    com.agent.monito.global.jwt.JwtTokenProvider: WARN